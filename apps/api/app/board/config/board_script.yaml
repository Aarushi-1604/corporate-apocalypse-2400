# Board Room Scripts for Quarters 1-4
# Maintains exact 6-exchange structure and 4-options-per-exchange rule.
# Scoring engine and deterministic thresholds are preserved.

exchanges:
  - speaker: chairperson
    question: "The board convened this session for a reason. Walk us through your executive strategy and operational trade-offs."
    options:
      - label: "Enforce rigorous cash preservation: defer discretionary capital outlay and prioritize balance sheet liquidity."
        confidence_delta: 5
      - label: "Accelerate market expansion: double down on revenue-generating verticals to outpace sector volatility."
        confidence_delta: 2
      - label: "Commit to organizational restructuring: streamline overhead and reallocate resources toward high-margin core competencies."
        confidence_delta: 4
      - label: "Maintain current operational velocity: absorb short-term variance while protecting foundational capability and client trust."
        confidence_delta: -4

  - speaker: lead_investor
    question: "Our return projections and enterprise valuation expectations for this quarter were missed. What is your strategic plan to correct course?"
    options:
      - label: "Implement strict gross-margin thresholds across all active contracts and exit low-yield corporate partnerships."
        confidence_delta: 4
      - label: "Pursue structured debt or mezzanine financing to defend runway without diluting existing shareholder equity."
        confidence_delta: 1
      - label: "Pivot capital expenditure aggressively into scalable, automated service delivery to permanently lower marginal cost."
        confidence_delta: 3
      - label: "Request patient capital allocation: absorb near-term yield compression to solidify defensible long-term market dominance."
        confidence_delta: -5

  - speaker: cfo
    question: "Cash reserves and working capital burn are critical concerns right now. How do we stabilize our solvency and balance sheet?"
    options:
      - label: "Enact an immediate enterprise-wide operating expenditure freeze and enforce zero-based departmental budgeting."
        confidence_delta: 5
      - label: "Renegotiate credit facilities and vendor payment terms to smooth cash outflow across subsequent quarters."
        confidence_delta: 3
      - label: "Monetize non-core corporate assets and intellectual property licenses to inject non-dilutive liquidity immediately."
        confidence_delta: 2
      - label: "Protect strategic R&D and talent retention expenditures by drawing against revolving credit reserves."
        confidence_delta: -4

  - speaker: independent_director
    question: "Governance concerns aside, do you believe our operational decisions reflect responsible enterprise risk management and corporate ethics?"
    options:
      - label: "Institute an independent compliance oversight audit to verify risk models and report directly to the board."
        confidence_delta: 4
      - label: "Affirm executive discretion: competitive speed in volatile markets necessitates calculated risk tolerance."
        confidence_delta: -5
      - label: "Establish transparent KPI disclosures and bind senior executive compensation to verified compliance milestones."
        confidence_delta: 3
      - label: "Commission a comprehensive risk-reward audit across all commercial deals before renewing any high-exposure contract."
        confidence_delta: 2

  - speaker: employee_rep
    question: "Frontline operational strain and morale are reaching breaking points. What concrete commitments do you offer to the workforce?"
    options:
      - label: "Establish a transparent corporate profit-sharing pool and link frontline retention incentives to company performance."
        confidence_delta: 4
      - label: "Initiate phased workforce automation to reduce operational bottleneck strain while providing retraining security buffers."
        confidence_delta: 2
      - label: "Cap executive discretionary spending and redirect internal capital into frontline operational safety and compensation."
        confidence_delta: 3
      - label: "Prioritize organizational survival above headcount guarantees: demand maximum productivity until stability is restored."
        confidence_delta: -4

  - speaker: government_observer
    question: "Municipal and regulatory authorities are scrutinizing our sector closely. Can you assure this board of sustained compliance and civic alignment?"
    options:
      - label: "Adopt proactive open-book regulatory reporting and invite municipal liaison monitoring into our operational auditing."
        confidence_delta: 5
      - label: "Establish a ring-fenced regulatory contingency escrow fund to buffer against potential municipal penalties or fines."
        confidence_delta: 3
      - label: "Engage municipal authorities in joint civic infrastructure initiatives to align corporate growth with urban priorities."
        confidence_delta: 2
      - label: "Mount a rigorous sovereign legal defense of corporate autonomy against expanding municipal oversight mandates."
        confidence_delta: -5

