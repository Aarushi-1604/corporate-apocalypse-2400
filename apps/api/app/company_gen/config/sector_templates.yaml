# ==============================================================================
# COMPANY TEMPLATES
# `id` here is a config-level slug, NOT a database UUID (that mapping
# happens later, when templates get seeded into company_templates).
# base_stats power-score band: see balance_check.py -- every template
# below was hand-checked to land within [270, 335].
# ==============================================================================

templates:
  - id: cybersecurity
    sector: Cybersecurity
    name_pool: ["Ironwall Systems", "Cipher & Vale", "Blacklatch Security"]
    backstory_pool:
      - "Born from the ashes of three failed national defense agencies, [Company] now sells the only thing anyone in 2400 still trusts: a locked door."
    base_stats: { cash: 70000, employees: 40, innovation: 65, brand: 45, esg: 40, market_share: 10, investor_confidence: 60 }
    unique_strength: "Deep encryption expertise means client data breaches are rare."
    unique_weakness: "High operating costs from constant threat monitoring."
    unique_passive_ability: "Fortress Protocol -- Risk accumulates 15% slower."
    passive_multipliers: { risk: 0.85 }

  - id: renewable_energy
    sector: Renewable Energy
    name_pool: ["Solvane Grid", "Meridian Power Collective", "Heliarc Energy"]
    backstory_pool:
      - "Formed from the merger of three bankrupt solar utilities, [Company] bet everything on fusion-adjacent grid tech when the old power ministries collapsed."
    base_stats: { cash: 75000, employees: 55, innovation: 55, brand: 45, esg: 75, market_share: 12, investor_confidence: 50 }
    unique_strength: "Public goodwill from visible environmental impact."
    unique_weakness: "Capital-intensive infrastructure limits fast expansion."
    unique_passive_ability: "Green Momentum -- ESG gains amplified 15%."
    passive_multipliers: { esg: 1.15 }

  - id: space_mining
    sector: Space Mining
    name_pool: ["Orbital Extraction Corp", "Vantablack Mining Guild", "Perigee Resources"]
